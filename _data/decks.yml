# One entry per deck. The Decks page and every deck page read from here,
# so a change to a description, list or Amazon link only needs making once.
- slug: roots-heritage
  anchor: roots
  name: "Roots & Heritage"
  color: "#9A5F3C"
  image: /assets/images/Roots-and-Heritage-600x1036.png
  image_full: /assets/images/Roots-and-Heritage.png
  box: /assets/images/boxes/box-roots-heritage.webp
  amazon: https://www.amazon.co.uk/dp/B0HFTBFC8X
  description: "A gentle exploration of where you come from, what shaped your lineage, and the stories passed down through generations."
  explores: "ancestry, family lines and inherited stories"
  intro: "This deck invites you into the landscapes of your ancestry, the stories you inherited, the patterns that shaped your family, the wounds and wisdom passed from one generation to the next."
  lede: "Every family carries stories. Some get told often. Others fade until no one remembers to ask."
  story: |
    **Death Bed Questions: Roots & Heritage** is a deck of **52 questions designed to help people talk about ancestry, family history, and the generations who came before them**.

    For someone near the end of life, it is a chance to pass on family knowledge before it is lost. For everyone else, it is a reason to finally ask, and to really listen.

    A single question might uncover a forgotten story, a family tradition, or a piece of hard-won wisdom that has been handed down for years **without anyone ever writing it down.**
  features:
    - title: "52 questions about where we come from"
      text: "Explores ancestry, family history, inherited beliefs, and the traditions passed from one generation to the next."
    - title: "For family gatherings and generational conversations"
      text: "Use with parents, grandparents, and loved ones around a table, during a visit, or in a quiet one-to-one moment."
    - title: "Handled with care for generational patterns"
      text: "Explores inherited behaviours, resilience, and family wounds, without requiring every question to be answered."
    - title: "A deck for remembering what matters"
      text: "Each card measures 7cm x 12cm, light enough to bring along to every family visit that counts."
- slug: childhood-becoming
  anchor: childhood
  name: "Childhood & Becoming"
  color: "#C79A8F"
  image: /assets/images/Childhood-and-Becoming-600x1035.png
  image_full: /assets/images/Childhood-and-Becoming.png
  box: /assets/images/boxes/box-childhood-becoming.webp
  amazon: https://www.amazon.co.uk/dp/B0HFT2VGY6
  description: "A tender return to the moments and influences that shaped who you became."
  explores: "early memories, shaping experiences and the inner child"
  intro: "This deck invites you to step gently back into your childhood: the innocence, joy, confusion, wonder and early shaping experiences."
  lede: "Before someone was a parent, a partner, or a grandparent, they were a child, with their own hopes, fears, and small adventures."
  story: |
    **Death Bed Questions: Childhood & Becoming** is a deck of **52 questions designed to help people revisit their early years and share the memories that shaped who they became**.

    For someone near the end of life, it can bring out stories their family has never heard: a chance to be known not only as they are now, but as they have always been.

    Use it alone with a journal, or share it across generations at a kitchen table or a hospital bedside.

    A question might bring a laugh, a memory that takes a moment to settle, or **a story no one thought to ask about until now.**
  features:
    - title: "52 questions that reach back to the beginning"
      text: "Revisits childhood homes, early friendships, and the moments of joy or struggle that shaped a life."
    - title: "For quiet reflection or shared conversation"
      text: "Explore alone with a journal, or share it between generations: parent and child, grandparent and grandchild."
    - title: "Welcomed in life review and hospice settings"
      text: "Used by therapists, hospice teams, palliative care professionals, and death doulas."
    - title: "Made to travel, meant to be kept"
      text: "Each card measures 7cm x 12cm, small enough for a bedside table and meaningful enough to become a keepsake."
- slug: love-connection
  anchor: love
  name: "Love & Connection"
  color: "#A85F65"
  image: /assets/images/Love-Connection-Deck-600x1035.png
  image_full: /assets/images/Love-Connection-Deck.png
  box: /assets/images/boxes/box-love-connection.webp
  amazon: https://www.amazon.co.uk/dp/B0HFTBBD24
  description: "A heart-opening deck designed to deepen closeness, trust, and emotional understanding."
  explores: "deeper intimacy, honesty and emotional truth"
  intro: "This deck explores the many forms of love: romantic, friendship, chosen family and deep bonds."
  lede: "Some of the truest things we feel for each other are the hardest to say out loud."
  story: |
    **Death Bed Questions: Love & Connection** is a deck of **52 questions designed to open the conversations that matter while there is still time to have them**: about romantic love, chosen family, old friendships, and the quiet bonds that shape a life.

    Each question makes room for what has gone unsaid, whether that is gratitude, an apology, or a feeling that was always there but never spoken.

    There is no pressure to answer every card and no wrong way to begin. One question might bring laughter. The next might bring tears, or **a memory that changes how you see someone you thought you already knew.**
  features:
    - title: "52 questions for the love that deserves words"
      text: "Explores trust, intimacy, friendship, and the relationships that have carried a life. The love that’s easy to feel and hard to say out loud."
    - title: "For when time feels more precious"
      text: "Made for people approaching the end of life, living with serious illness, or simply wanting to say what still needs saying to someone they love."
    - title: "A gentle opening for hard-to-start conversations"
      text: "Use during quiet visits, family moments, or one-to-one conversations, when the right words won’t come on their own."
    - title: "Trusted in hospice, therapy and grief support"
      text: "Used by hospices, palliative care teams, therapists, counsellors, and death doulas supporting reflection and connection."
    - title: "Made to be held, not just read"
      text: "Each card measures 7cm x 12cm, a keepsake as much as a conversation piece."
- slug: loss-regret-forgiveness
  anchor: loss
  name: "Loss, Regret & Forgiveness"
  color: "#7D788C"
  image: /assets/images/Loss-Regret-Forgiveness-1-600x1035.png
  image_full: /assets/images/Loss-Regret-Forgiveness-1.png
  box: /assets/images/boxes/box-loss-regret-forgiveness.webp
  amazon: https://www.amazon.co.uk/dp/B0HFT87JYK
  description: "A tender deck for exploring grief, regret, forgiveness, and emotional release."
  explores: "grief, healing, release and truth-telling"
  intro: "This deck opens a space for acknowledgement, healing and repair."
  lede: "Some things get heavier the longer they stay unspoken."
  story: |
    **Death Bed Questions: Loss, Regret & Forgiveness** is a deck of **52 questions designed to gently open up what has been carried in silence: losses that changed us, words left unsaid, and feelings that have been difficult to let go of**.

    The questions don’t ask anyone to forgive, resolve, or make peace before they’re ready. They simply offer a place to begin.

    For someone near the end of life, that might mean speaking honestly about regret. For family, it might mean finally hearing something that has waited years to be said.

    Whatever comes up, relief, sadness, recognition, or simply a pause, **there is space for it here.**
  features:
    - title: "52 questions for what’s still being carried"
      text: "Opens space for grief, regret, forgiveness, and the truths that get heavier the longer they stay unspoken."
    - title: "Not about forcing resolution"
      text: "A starting point for conversations that feel too difficult to begin alone. No pressure to forgive, explain, or arrive anywhere in particular."
    - title: "For the things that need to be heard"
      text: "Made for people near the end of life who want to speak more openly before time becomes more limited."
    - title: "Supporting families, grief work and therapy"
      text: "Used by therapists, counsellors, grief workers, hospice teams, and death doulas."
    - title: "A companion for the hardest conversations"
      text: "Each card measures 7cm x 12cm, small enough to hold in one hand, big enough to hold what matters."
- slug: meaning-purpose
  anchor: meaning
  name: "Meaning & Purpose"
  color: "#4F6475"
  image: /assets/images/Meaning-Purpose-Deck-600x1035.png
  image_full: /assets/images/Meaning-Purpose-Deck.png
  box: /assets/images/boxes/box-meaning-purpose.webp
  amazon: https://www.amazon.co.uk/dp/B0HFKJMTPV
  description: "A reflective deck for discovering what truly mattered."
  explores: "values, wisdom, personal truth and life direction"
  intro: "This deck explores values, identity, spiritual insight and meaning-making."
  lede: "Some of the most important conversations happen once time starts to feel limited."
  story: |
    **Death Bed Questions: Meaning & Purpose** is a deck of **52 questions designed to help people reflect on what has truly mattered to them: their values, beliefs, identity, and the meaning they have made of their life**.

    There is no set order and no need to find a perfect answer. A question might get a short reply, or it might become a story, a memory, a laugh, or a long pause that says more than words could.

    This deck is not looking for the right answer. It is here to help someone **be understood a little more deeply while there is still time to ask.**
  features:
    - title: "52 questions about what has truly mattered"
      text: "Explores values, identity, wisdom, and the sources of meaning that shaped a life."
    - title: "A gentle invitation to look back"
      text: "Made for people reflecting on the life they’ve lived: the beliefs they’ve held, the lessons they’ve learned, the truths worth sharing."
    - title: "For clarity when time feels more precious"
      text: "Suited to people approaching end of life or living with serious illness who want to speak from the heart while there’s time."
    - title: "Used thoughtfully in care and reflection settings"
      text: "Welcomed by hospices, palliative care teams, therapists, counsellors, and death doulas."
    - title: "A small deck for life’s biggest questions"
      text: "Each card measures 7cm x 12cm, easy to hold in one hand, hard to forget once asked."
- slug: legacy-letting-go
  anchor: legacy
  name: "Legacy & Letting Go"
  color: "#8FA897"
  image: /assets/images/Legacy-and-letting-go-600x1035.png
  image_full: /assets/images/Legacy-and-letting-go.png
  box: /assets/images/boxes/box-legacy-letting-go.webp
  amazon: https://www.amazon.co.uk/dp/B0HFSZFS3L
  description: "A sacred deck designed to help you explore endings, legacy, and release."
  explores: "endings, blessings, continuation and peaceful transition"
  intro: "Legacy & Letting Go explores the final chapters of life: the wisdom we leave, the memories we bless, and the acceptance that arrives when we allow ourselves to let go."
  lede: "Saying goodbye isn’t only about endings. It’s also about remembering, blessing, and deciding what we hope carries on after us."
  story: |
    **Death Bed Questions: Legacy & Letting Go** is a deck of **52 questions designed to help people near the end of life reflect on the life they have lived and what they most want to be remembered for**.

    For families, it offers a reason to sit down, listen, and hold on to words and stories that might otherwise be lost.

    There is no expectation to feel peaceful or resolved. A card might bring back a memory, spark laughter, surface a practical wish, or simply lead to **a few quiet minutes together.**
  features:
    - title: "52 questions about what remains"
      text: "Explores final chapters, blessings, memory, and the legacy someone hopes will continue in the people they love."
    - title: "A gentle path toward peace"
      text: "Invites reflection on endings, gratitude, and release, without asking anyone to feel ready, resolved, or certain of anything."
    - title: "For goodbyes that deserve more than silence"
      text: "Made for people preparing to say goodbye, and for families who want to listen while there’s still time."
    - title: "Held with care by professionals too"
      text: "Used by hospice teams, palliative care professionals, therapists, counsellors, and death doulas."
    - title: "A deck made to be passed down"
      text: "Each card measures 7cm x 12cm, small enough to keep close and meaningful enough to keep for good."
- slug: the-mixed-deck-essentials-collection
  anchor: essential
  essential: true
  name: "The Essential Collection"
  box: /assets/images/boxes/box-the-mixed-deck-essentials-collection.webp
  color: "#999a7f"
  amazon: https://www.amazon.co.uk/dp/B0HFTBFHD3
  description: "A curated starting point: 52 cards specially selected from across all six decks."
  explores: "questions drawn from all six decks"
  intro: "The Essential Collection contains a curated selection from the six themes; it is not an additional set of completely different questions."
  lede: "Sometimes it only takes one question to open a door that’s been closed for years."
  story: |
    Death Bed Questions began as a personal act of healing: a way to ask what had never been asked, before it was too late.

    **The Essential Collection** brings together **52 of the most powerful questions from all six decks**: love and connection, roots and heritage, childhood and becoming, loss and forgiveness, meaning and purpose, and legacy and letting go.

    It is one deck made to go wherever a conversation is needed, whether that is at a bedside, a kitchen table, or a quiet evening between old friends.

    There is no order to follow and nothing you have to answer. A question might bring laughter, silence, tears, or a memory that has not been spoken aloud in decades. **All of it has a place here.**
  features:
    - title: "A lifetime of questions, one deck"
      text: "52 of the most searching questions pulled from all six Death Bed Questions collections: love, roots, childhood, loss, meaning, and legacy. One deck for the conversations that hold a whole life."
    - title: "Born from loss, made for the living"
      text: "Created after asking too late what should have been asked sooner. This deck exists so no one has to wonder what someone wanted to say."
    - title: "For every chapter, every relationship"
      text: "Moves between memory, meaning, grief, and gratitude. One companion for family tables, hospice rooms, and quiet evenings that matter."
    - title: "Welcomed by families and professionals alike"
      text: "Used at home with loved ones or introduced by therapists, death doulas, hospice teams, and palliative care staff."
    - title: "A keepsake made to last"
      text: "Each card measures 7cm x 12cm, small enough to carry and made to be picked up again and again."
