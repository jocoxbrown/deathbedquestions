{% comment %}One flippable card. Pass: shift (hue), label, title, and a back block via capture "back".{% endcomment %}
<li class="ht-card" style="--shift: {{ include.shift | default: '0deg' }};{% if include.shift == '0deg' %} --sat: 1;{% endif %} --tint: {{ include.tint | default: '#9A5F3C' }}"{% if include.id %} id="{{ include.id }}"{% endif %}>
<div class="ht-card-inner">
<div class="ht-face ht-front">
<img class="ht-splash ht-splash-top" src="{{ site.baseurl }}/assets/images/home/splash-top.webp" alt="" aria-hidden="true">
<img class="ht-splash ht-splash-bottom" src="{{ site.baseurl }}/assets/images/home/splash-bottom.webp" alt="" aria-hidden="true">
<p class="ht-card-label">{{ include.label }}</p>
<h3 class="ht-card-title">{{ include.title }}</h3>
<button class="ht-turn" type="button" aria-label="Turn over: {{ include.title | strip_html }}">Turn over {% include turn-icon.html %}</button>
</div>
<div class="ht-face ht-back">
<p class="ht-card-label">{{ include.label }}</p>
{{ include.back }}
<button class="ht-turn" type="button" aria-label="Turn back: {{ include.title | strip_html }}">Turn back {% include turn-icon.html %}</button>
</div>
</div>
</li>
